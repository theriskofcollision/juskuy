<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Juskuy | AI Smoothie</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <div class="app-container">
        <!-- Landing View -->
        <div id="landing-view" class="view active">
            <div class="brand">
                <span class="emoji">🥤</span>
                <h1>Juskuy</h1>
                <p>Your personal AI smoothie coach.</p>
            </div>
            
            <div class="choice-container">
                <button class="btn btn-browser" onclick="startChat()">
                    <span>Continue in Browser</span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </button>
                <button class="btn btn-history" onclick="showHistory()" style="margin-top:10px; background-color:#333; color:white;">
                    <span>View Order History</span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </button>
                <div class="divider"><span>OR</span></div>
                <button class="btn btn-whatsapp" onclick="alert('In production, this opens WhatsApp directly.')">
                    <span>Chat on WhatsApp</span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                </button>
                <p class="privacy-note">No app download required. 100% private.</p>
            </div>
        </div>

        <!-- Chat View -->
        <div id="chat-view" class="view">
            <div class="chat-header">
                <div class="back-btn" onclick="backToLanding()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
                </div>
                <h2>Juskuy AI</h2>
            </div>
            <div class="chat-box" id="chat-box">
                <!-- Chat messages will be appended here -->
            </div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Type your answer..." disabled>
                <button id="send-btn" class="send-btn" disabled onclick="handleSend()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </div>

        <!-- History View -->
        <div id="history-view" class="view" style="display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:white; z-index:100; flex-direction:column;">
            <div class="chat-header">
                <div class="back-btn" onclick="closeHistory()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
                </div>
                <h2>Order History</h2>
            </div>
            <div class="chat-box" id="history-box" style="flex:1; overflow-y:auto; padding:20px;">
                <p>Loading history...</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
